name: WSJ NYA History Probe

on:
  push:
    branches:
      - feat/st-model-native

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe WSJ NYA historical CSV and HTML ranges
        shell: bash
        run: |
          node <<'NODE'
          const variants = [
            ['download-www', 'https://www.wsj.com/market-data/quotes/index/NYA/historical-prices/download?num_rows=400&range_days=600&startDate=01/01/2025&endDate=09/15/2026'],
            ['download-quotes', 'https://quotes.wsj.com/index/NYA/historical-prices/download?num_rows=400&range_days=600&startDate=01/01/2025&endDate=09/15/2026'],
            ['html-range', 'https://www.wsj.com/market-data/quotes/index/NYA/historical-prices?num_rows=400&range_days=600&startDate=01/01/2025&endDate=09/15/2026'],
          ];
          const headers = {
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
            'accept': 'text/csv,text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
            'if-modified-since': 'Sat, 1 Jan 2000 00:00:00 GMT',
          };
          for (const [name, url] of variants) {
            try {
              const response = await fetch(url, { headers, redirect: 'follow' });
              const body = await response.text();
              const lines = body.split(/\r?\n/).filter(Boolean);
              const dateRows = lines.filter((line) => /(?:09\/14\/26|2026-09-14|Sep\.?\s+14,?\s+2026)/i.test(line));
              const oldRows = lines.filter((line) => /(?:04\/0[1-9]\/26|2026-04-0[1-9]|Apr\.?\s+[1-9],?\s+2026)/i.test(line));
              console.log(`VARIANT=${name}`);
              console.log(`STATUS=${response.status}`);
              console.log(`FINAL_URL=${response.url}`);
              console.log(`CONTENT_TYPE=${response.headers.get('content-type') ?? ''}`);
              console.log(`BYTES=${body.length}`);
              console.log(`LINES=${lines.length}`);
              console.log(`SEP14_MATCH=${JSON.stringify(dateRows.slice(0,2))}`);
              console.log(`APRIL_MATCH_COUNT=${oldRows.length}`);
              console.log(`PREFIX=${JSON.stringify(body.slice(0,240).replace(/\s+/g,' '))}`);
            } catch (error) {
              console.log(`VARIANT=${name} ERROR=${error instanceof Error ? error.message : String(error)}`);
            }
          }
          NODE
