name: WSJ Market Diary Probe

on:
  push:
    branches:
      - feat/st-model-native

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe WSJ Market Diary JSON
        shell: bash
        run: |
          node <<'NODE'
          const url = new URL('https://www.wsj.com/market-data/stocks/marketsdiary');
          url.searchParams.set('id', JSON.stringify({ application: 'WSJ', marketsDiaryType: 'diaries' }));
          url.searchParams.set('type', 'mdc_marketsdiary');

          const response = await fetch(url, {
            headers: {
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'if-modified-since': 'Sat, 1 Jan 2000 00:00:00 GMT',
              'accept': 'application/json,text/plain,*/*'
            }
          });

          const body = await response.text();
          console.log(`HTTP_STATUS=${response.status}`);
          console.log(`CONTENT_TYPE=${response.headers.get('content-type') ?? ''}`);
          if (!response.ok) {
            console.log(`BODY_PREFIX=${body.slice(0, 300).replace(/\s+/g, ' ')}`);
            process.exit(2);
          }

          let payload;
          try {
            payload = JSON.parse(body);
          } catch (error) {
            console.log(`BODY_PREFIX=${body.slice(0, 300).replace(/\s+/g, ' ')}`);
            throw error;
          }

          const sets = payload?.data?.instrumentSets;
          if (!Array.isArray(sets)) throw new Error('instrumentSets missing');

          let match = null;
          for (const set of sets) {
            const label = set?.headerFields?.[0]?.label ?? set?.headerFields?.[0]?.value ?? '';
            const instruments = Array.isArray(set?.instruments) ? set.instruments : [];
            const highs = instruments.find((row) => String(row?.id ?? '').toLowerCase() === 'newhighs' || String(row?.name ?? '').toLowerCase() === 'new highs');
            const lows = instruments.find((row) => String(row?.id ?? '').toLowerCase() === 'newlows' || String(row?.name ?? '').toLowerCase() === 'new lows');
            if (highs && lows && /nasdaq/i.test(String(label))) {
              match = { label, highs, lows };
              break;
            }
          }

          if (!match) {
            // Older response shapes put exchange names in headerFields and the same metric rows in one set.
            for (const set of sets) {
              const headers = Array.isArray(set?.headerFields) ? set.headerFields : [];
              const nasdaqField = headers.find((h) => /nasdaq/i.test(String(h?.label ?? h?.value ?? '')));
              const instruments = Array.isArray(set?.instruments) ? set.instruments : [];
              const highs = instruments.find((row) => /new highs/i.test(String(row?.name ?? '')));
              const lows = instruments.find((row) => /new lows/i.test(String(row?.name ?? '')));
              if (nasdaqField && highs && lows) {
                const key = nasdaqField.value;
                match = {
                  label: nasdaqField.label ?? key,
                  highs: { latestClose: highs[key], name: highs.name },
                  lows: { latestClose: lows[key], name: lows.name }
                };
                break;
              }
            }
          }

          if (!match) {
            console.log(`TOP_LEVEL_TIMESTAMP=${payload?.data?.timestamp ?? ''}`);
            console.log(`SET_SUMMARY=${JSON.stringify(sets.map((s) => ({headers:s?.headerFields, ids:(s?.instruments ?? []).map((i) => i?.id ?? i?.name).slice(0,15)})))}`);
            throw new Error('Nasdaq new-high/new-low rows not found');
          }

          const h = match.highs;
          const l = match.lows;
          console.log(`NASDAQ_LABEL=${match.label}`);
          console.log(`NEW_HIGHS=${h.latestClose ?? h.NASDAQ ?? h.nasdaq ?? ''}`);
          console.log(`NEW_LOWS=${l.latestClose ?? l.NASDAQ ?? l.nasdaq ?? ''}`);
          console.log(`PREVIOUS_HIGHS=${h.previousClose ?? ''}`);
          console.log(`PREVIOUS_LOWS=${l.previousClose ?? ''}`);
          console.log(`WEEK_AGO_HIGHS=${h.weekAgo ?? ''}`);
          console.log(`WEEK_AGO_LOWS=${l.weekAgo ?? ''}`);
          console.log(`ROW_TIMESTAMP=${h.timestamp ?? l.timestamp ?? payload?.data?.timestamp ?? ''}`);
          NODE
