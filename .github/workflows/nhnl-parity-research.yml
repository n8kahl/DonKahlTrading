name: NHNL Parity Research

on:
  push:
    branches:
      - feat/st-model-native

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Massive credential
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "MASSIVE_API_KEY GitHub secret is not configured" >&2
            exit 2
          fi

      - name: Run NHNL parity reconstruction
        id: parity
        shell: bash
        run: |
          set +e
          node scripts/research-nhnl-parity.mjs > nhnl-parity-result.json 2> nhnl-parity-progress.log
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat nhnl-parity-progress.log
          cat nhnl-parity-result.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: nhnl-parity-evidence
          path: |
            nhnl-parity-result.json
            nhnl-parity-progress.log
          if-no-files-found: error

      - name: Report parity status
        run: |
          if [ "${{ steps.parity.outputs.exit_code }}" = "0" ]; then
            echo "Exact workbook parity candidate found."
          else
            echo "No 10/10 exact candidate in current methodology matrix; evidence artifact uploaded."
          fi
