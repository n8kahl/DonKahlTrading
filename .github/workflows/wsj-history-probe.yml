name: WSJ Market Diary History Probe

on:
  push:
    branches:
      - feat/st-model-native

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe historical parameter variants
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://www.wsj.com/market-data/stocks/marketsdiary';
          const variants = [
            ['base', {}, { application: 'WSJ', marketsDiaryType: 'diaries' }],
            ['date-iso', { date: '2024-02-15' }, { application: 'WSJ', marketsDiaryType: 'diaries' }],
            ['date-compact', { date: '20240215' }, { application: 'WSJ', marketsDiaryType: 'diaries' }],
            ['date-us', { date: '02/15/2024' }, { application: 'WSJ', marketsDiaryType: 'diaries' }],
            ['pastcalendar-compact', { date: '20240215', mod: 'mdc_pastcalendar' }, { application: 'WSJ', marketsDiaryType: 'diaries' }],
            ['id-date-iso', {}, { application: 'WSJ', marketsDiaryType: 'diaries', date: '2024-02-15' }],
            ['id-date-compact', {}, { application: 'WSJ', marketsDiaryType: 'diaries', date: '20240215' }],
          ];

          function number(v) { return v == null ? null : Number(String(v).replace(/,/g, '')); }
          function extract(payload) {
            const sets = payload?.data?.instrumentSets ?? [];
            for (const set of sets) {
              const label = String(set?.headerFields?.[0]?.label ?? '');
              if (!/nasdaq/i.test(label)) continue;
              const rows = set?.instruments ?? [];
              const highs = rows.find((r) => String(r?.id ?? '').toLowerCase() === 'newhighs');
              const lows = rows.find((r) => String(r?.id ?? '').toLowerCase() === 'newlows');
              if (highs && lows) return {
                timestamp: highs.timestamp ?? lows.timestamp ?? payload?.data?.timestamp ?? null,
                highs: number(highs.latestClose), lows: number(lows.latestClose),
                prevHighs: number(highs.previousClose), prevLows: number(lows.previousClose),
                weekHighs: number(highs.weekAgo), weekLows: number(lows.weekAgo),
              };
            }
            return { timestamp: payload?.data?.timestamp ?? null };
          }

          for (const [name, extras, id] of variants) {
            const url = new URL(base);
            url.searchParams.set('id', JSON.stringify(id));
            url.searchParams.set('type', 'mdc_marketsdiary');
            for (const [k, v] of Object.entries(extras)) url.searchParams.set(k, v);
            const res = await fetch(url, { headers: {
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'if-modified-since': 'Sat, 1 Jan 2000 00:00:00 GMT',
              'accept': 'application/json,text/plain,*/*'
            }});
            let parsed = null;
            try { parsed = JSON.parse(await res.text()); } catch {}
            console.log(`${name} status=${res.status} data=${JSON.stringify(parsed ? extract(parsed) : null)}`);
          }
          NODE
