name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tucson_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint baseline check
        run: |
          if [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "::warning::package.json defines npm run lint, but eslint is not installed in this repository yet"
          fi

      - name: Unit tests
        run: npm run test:run

      - name: ST Model standalone-script syntax
        run: |
          node --check scripts/research-nhnl-parity.mjs
          node --check scripts/snapshot-wsj-breadth.mjs

      - name: Build
        run: npm run build

      - name: Install Chromium for ST Model smoke test
        run: npx playwright install --with-deps chromium

      - name: ST Model browser smoke
        run: npx playwright test e2e/st-model.spec.ts
